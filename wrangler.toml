# Config de Cloudflare para el sitio (Pages) + base de datos D1.
# El sitio publico se sirve desde public/ (build output dir, se fija en el dashboard).
# Este archivo, functions/, README.md y CLAUDE.md quedan en la raiz del repo -> NO se sirven.

name = "adriana-rogelio-invitacion"
pages_build_output_dir = "public"
compatibility_date = "2026-07-25"

# Enlaza la base D1 a la variable env.rsvp que usan las Functions.
# El database_id lo obtienes al crear la base (ver backend/README.md).
[[d1_databases]]
binding = "rsvp"
database_name = "rsvp"
database_id = "1f333389-2ee4-4a7e-9ebf-c6322001bc14"
